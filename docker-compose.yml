services:

  rosbot_simulation:
    build:
      context: .
      dockerfile: ./src/docker/simulation/Dockerfile
    image: project-rosbot-gazebo-hostage:humble
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ./src:/workspaces/project/src:ro
    environment:
      - DISPLAY=${DISPLAY:?err}
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - GAZEBO_MODEL_PATH=/workspaces/project/src/husarion_gz_worlds/models
      - GZ_SIM_RESOURCE_PATH=/workspaces/project/src/husarion_gz_worlds/models:/ros2_ws/install/rosbot_description/share:/ros2_ws/install/husarion_components_description/share
      - IGN_GAZEBO_RESOURCE_PATH=/workspaces/project/src/husarion_gz_worlds/models:/ros2_ws/install/rosbot_description/share:/ros2_ws/install/husarion_components_description/share
      - IGN_GAZEBO_SYSTEM_PLUGIN_PATH=/tmp/hostage_ws/install/lib
      - GZ_SIM_SYSTEM_PLUGIN_PATH=/tmp/hostage_ws/install/lib
      - RESCUE_SCENARIO=${RESCUE_SCENARIO:-scenario_1}
    runtime: nvidia
    command: python3 /workspaces/project/src/launch/run_office_simulation.py

  slam:
    image: husarion/slam-toolbox:humble
    command: >
      ros2 launch slam_toolbox online_sync_launch.py
        slam_params_file:=/slam_params/rosbot2.yaml
        use_sim_time:=True

  navigation:
    image: husarion/navigation2:humble
    command: >
      ros2 launch nav2_bringup navigation_launch.py params_file:=/nav2_params/rosbot2_navigation.yaml
        use_sim_time:=True

  rviz2:
    image: husarion/rosbot-gazebo:humble
    depends_on:
      - rosbot_simulation
      - slam
      - navigation
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ./src/config:/workspaces/project/config:ro
    environment:
      - DISPLAY=${DISPLAY:?err}
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
    runtime: nvidia
    command: >
      bash -lc "source /opt/ros/humble/setup.bash &&
      source /ros2_ws/install/setup.bash &&
      ros2 run rviz2 rviz2 -d /workspaces/project/config/office_nav2.rviz"

  frontier_explorer:
    build:
      context: .
      dockerfile: ./src/docker/frontier/Dockerfile
    depends_on:
      - rosbot_simulation
      - slam
      - navigation
    volumes:
      - ./src:/workspaces/project/src
    working_dir: /workspaces/project/src/ros2_ws
    environment:
      - PYTHONUNBUFFERED=1
      - RESCUE_SCENARIO=${RESCUE_SCENARIO:-scenario_1}
    command: >
      bash /workspaces/project/src/docker/frontier/entrypoint.sh
        ros2 launch frontier_explorer frontier_explorer.launch.py
        params_file:=/workspaces/project/src/config/frontier_params.yaml

  hostage_mission:
    image: project-rosbot-gazebo-hostage:humble
    depends_on:
      - rosbot_simulation
    volumes:
      - ./src:/workspaces/project/src:ro
    environment:
      - PYTHONUNBUFFERED=1
      - RESCUE_SCENARIO=${RESCUE_SCENARIO:-scenario_1}
    command: >
      bash -lc "source /opt/ros/humble/setup.bash &&
      source /tmp/hostage_ws/install/setup.bash &&
      ros2 launch hostage_sim hostage_sim.launch.py"
